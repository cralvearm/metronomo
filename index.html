<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Metrónomo — secuenciador de tempos y poliritmos</title>
  <meta name="description" content="Programa los tempos de una pieza, cambia de pulso con un clic y practica poliritmos configurables.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="theme-color" content="#ffffff">
  <link rel="stylesheet" href="app.css">
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem("metronomo-theme"); } catch (e) {}
      if (t !== "light" && t !== "dark") {
        t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="hbtns">
        <button id="themeBtn" class="ghost sm" title="Cambiar tema"></button>
      </div>
    </header>

    <section class="card" id="mainCard" aria-label="Pulso actual"></section>

    <div class="cols">
      <section class="span2" aria-label="Secciones">
        <div class="colhead">
          <h2>Secciones</h2>
          <button id="addStepBtn" class="ghost xs">+ Sección</button>
        </div>
        <div id="sections"></div>
      </section>
      <section aria-label="Piezas">
        <h2>Piezas</h2>
        <div class="card savecard">
          <div class="saverow">
            <input id="packName" class="in" placeholder="Nombre de la pieza">
            <button id="savePackBtn" class="primary xs">Guardar</button>
          </div>
          <p class="fine">Guarda los pulsos y ritmos de esta pieza. Si el nombre ya existe, la sobrescribe. Las piezas se guardan en este navegador.</p>
        </div>
        <div id="packs"></div>
        <button id="ioBtn" class="ghost block">Exportar / importar (JSON)</button>
        <div id="ioPanel" class="iopanel" hidden>
          <textarea id="ioText" rows="6" placeholder='Pega aquí una pieza {"name": "...", "steps": [...]} o una lista exportada, y pulsa Importar.'></textarea>
          <div class="iorow">
            <button id="ioImport" class="primary">Importar</button>
            <button id="ioClose" class="ghost sm">Cerrar</button>
          </div>
          <p id="ioMsg" class="fine"></p>
        </div>
      </section>
    </div>

  </div>
  <div class="playbar">
    <button id="playBtn" class="primary playbig" disabled></button>
    <div class="volrow">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>
      <input id="volInput" type="range" min="0" max="1" step="0.05" value="0.85" aria-label="Volumen general">
    </div>
  </div>
  <script src="app.js" defer></script>
</body>
</html>
